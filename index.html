<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIR Simulation Tool</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>SIR Simulation Tool</h1>
      <p>
        Explore a simple Susceptible-Infected-Recovered epidemic model directly in your browser.
      </p>
    </header>

    <section class="card controls">
      <h2>Simulation Inputs</h2>
      <form id="sir-form">
        <div class="grid">
          <label>
            Population (N)
            <input type="number" id="population" min="1" step="1" value="1000" required />
          </label>

          <label>
            Initial Infected (I₀)
            <input type="number" id="infected0" min="0" step="1" value="1" required />
          </label>

          <label>
            Initial Recovered (R₀)
            <input type="number" id="recovered0" min="0" step="1" value="0" required />
          </label>

          <label>
            Transmission Rate (beta)
            <input type="number" id="beta" min="0" step="0.01" value="0.3" required />
          </label>

          <label>
            Recovery Rate (gamma)
            <input type="number" id="gamma" min="0" step="0.01" value="0.1" required />
          </label>

          <label>
            Days
            <input type="number" id="days" min="1" step="1" value="160" required />
          </label>
        </div>

        <div class="actions">
          <button type="submit">Run Simulation</button>
        </div>
      </form>
      <p id="error-message" class="error" aria-live="polite"></p>
    </section>

    <section class="card results">
      <h2>Summary</h2>
      <div class="summary-grid">
        <div>
          <span class="label">Basic Reproduction Number</span>
          <strong id="summary-r0">--</strong>
        </div>
        <div>
          <span class="label">Peak Infected</span>
          <strong id="summary-peak">--</strong>
        </div>
        <div>
          <span class="label">Day of Peak</span>
          <strong id="summary-day">--</strong>
        </div>
        <div>
          <span class="label">Final Recovered</span>
          <strong id="summary-final-recovered">--</strong>
        </div>
      </div>
    </section>

    <section class="card chart-card">
      <h2>Simulation Plot</h2>
      <canvas id="sir-chart"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
